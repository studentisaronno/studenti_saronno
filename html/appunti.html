<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="../imgs/Logo.svg" />
    <link rel="stylesheet" href="../css/appunti.css" />
    <!--Adobe fonts-->
    <link rel="stylesheet" href="https://use.typekit.net/cjq4cdm.css" />
    <link rel="stylesheet" href="../css/root.css" />


    <script src="../js/header-footer.js"></script>
    <script src="../js/index.js"></script>


    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@uploadcare/file-uploader@1/web/uc-file-uploader-regular.min.css">

<body style="margin: 0">

    <div id="upload-form-container" class="upload-form-container" style="visibility: hidden;">

        <form class="upload-form" id="custom-upload-form">

            <button class="close-form-button" onclick="switchFormState()">
            </button>

            <input type="text" class="file-name-input" id="file-name" placeholder="File name">
            <!-- <input type="text" class="filer-name-input" id="filter-name" placeholder="Filter"> -->

            <div class="file-input-container">
                <label for="file-input">
                    <img src="../imgs/graffetta.png">
                    <p>Upload File</p>
                </label>
                <input type="file" id="file-input" multiple accept=".pdf, image/*">
            </div>

            <button type="submit" class="upload-file-button" id="submit-button">Upload</button>
        </form>
    </div>

    <div id="header"></div>
    
    <main>
        <div class="titolo-div">
            <h1 class="titolo-font">Appunti</h1>
        </div>

        <div class="tabs-appunti header-link">
            <a href="#" id="miei-appunti" onclick="getUserNotes()">Miei appunti</a>
            <a href="#" id="tutti-appunti" onclick="getAllNotes()">Tutti gli appunti</a>
            <a href="#" id="carica-appunti" onclick="switchFormState()">Carica appunti</a>
            <div class="cerca-appunti-div">
                <input type="text" id="search-notes-input" placeholder="Cerca appunti...">
                <button onclick="searchNotes()">Cerca</button>
            </div>
        </div>

        <div class="appunti-div">
            <div class="lista-appunti-div" id="lista-appunti">

            </div>
            <div class="appunti-utente"></div>

        </div>
    </main>

    <div id="footer"></div>

</body>

<script type="module">
    import { uploadFile } from 'https://esm.run/@uploadcare/upload-client';
    import { jsPDF } from "https://esm.run/jspdf";
    import "../js/appunti.js"

    const browseFile = document.getElementById("file-input");
    let filesImg = false;
    let filesPdf = false;

    function resetForm() {
        document.getElementById("submit-button").style.backgroundColor = "/* wrong color */ var(--medio)";
        document.getElementById("custom-upload-form").reset();
    }

    browseFile.addEventListener('change', async (e) => {
        const files = e.target.files;
        filesImg = false;
        filesPdf = false;

        for (let i = 0; i < files.length; i++) {
            if (files[i].type.includes("image")) filesImg = true;
            if (files[i].type.includes("pdf")) filesPdf = true;
        }

        if (filesImg && filesPdf) {
            alert("Non puoi caricare sia immagini che PDF");
            resetForm();
        }
    });

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function getImageDimensions(base64String) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve({ imgElement: img, width: img.width, height: img.height });
            img.onerror = reject;
            img.src = base64String;
        });
    }

    // Genera thumbnail PNG dalla prima pagina del PDF
    async function generatePdfThumbnail(pdfFile) {
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const arrayBuffer = await pdfFile.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const page = await pdf.getPage(1);

        // Scala della thumbnail per avere immagine di larghezza 1000px
        let scaleImg = 1000 / page.getViewport().viewBox[2];

        // Scala più alta = thumbnail più nitida
        const viewport = page.getViewport({ scale: scaleImg });

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport
        }).promise;

        pdf.destroy();

        // Converti canvas in Blob PNG
        return new Promise(resolve => canvas.toBlob(resolve, 'image/jpg'));
    }

    // Carica un blob su Uploadcare e restituisce il cdnUrl
    async function uploadToUploadcare(blob, fileName) {
        const result = await uploadFile(blob, {
            publicKey: "5d17d1b4539b6db92808",
            store: 'auto',
            fileName: fileName
        });
        return result;
    }

    const submit_btn = document.getElementById("submit-button");

    submit_btn.addEventListener('click', async (e) => {
        e.preventDefault();

        const fileInput = document.getElementById("file-input");
        const fileName = document.getElementById("file-name").value;

        if (fileInput.files.length === 0) {
            alert("Seleziona un file da caricare");
            return;
        }

        if (!fileName) {
            alert("Inserisci un nome per il file");
            return;
        }

        document.getElementById("submit-button").style.backgroundColor = "gray";

        try {
            let pdfBlob;
            let thumbnailBlob;

            if (filesImg) {
                // Converti immagini in PDF
                let doc;
                for (let i = 0; i < fileInput.files.length; i++) {
                    const imageData = await readFileAsBase64(fileInput.files[i]);
                    const { width, height } = await getImageDimensions(imageData);
                    const orientation = width > height ? 'landscape' : 'portrait';

                    if (i === 0) {
                        doc = new jsPDF({ unit: "px", orientation, format: [width, height] });
                    } else {
                        doc.addPage([width, height], orientation);
                    }
                    doc.addImage(imageData, "JPEG", 0, 0, width, height, undefined, "FAST");
                }
                pdfBlob = doc.output('blob');

            } else {
                if (fileInput.files.length > 1) {
                    alert("Puoi caricare un PDF alla volta");
                    document.getElementById("submit-button").style.backgroundColor = "/* wrong color */ var(--medio)";
                    return;
                }
                pdfBlob = fileInput.files[0];
            }

            // Genera thumbnail prima di caricare
            console.log("Generando thumbnail...");
            thumbnailBlob = await generatePdfThumbnail(pdfBlob);

            // Carica PDF e thumbnail in parallelo su Uploadcare
            console.log("Caricamento su Uploadcare...");
            const result = await uploadFile(pdfBlob, {
                publicKey: "5d17d1b4539b6db92808",
                store: 'auto',
                fileName: fileName
            });

            console.log("PDF URL:", result.uuid);
            const resultThumbnail = await uploadFile(thumbnailBlob, {
                publicKey: "5d17d1b4539b6db92808",
                store: 'auto',
                fileName: fileName + "_thumbnail.jpg"
            });

            console.log("Thumbnail URL:", resultThumbnail.uuid);

            const formData = {
                fileName: fileName,
                fileUrl: "https://4jzuykndqt.ucarecd.net/" + result.uuid + "/",
                thumbnailUrl: "https://4jzuykndqt.ucarecd.net/" + resultThumbnail.uuid + "/"
            }

            // Salva entrambi gli URL nel backend
            await fetch("/upload/note", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            });

            resetForm();
            document.getElementById("upload-form-container").style.visibility = "hidden";
            console.log("Upload completato!");
            getAllNotes();

        } catch (error) {
            console.error("Errore durante l'upload:", error);
            document.getElementById("submit-button").style.backgroundColor = "/* wrong color */ var(--medio)";
        }
    });
</script>
